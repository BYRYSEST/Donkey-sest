<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Donkey Sest</title>
<style>
  /* A tela do jogo ocupa a janela inteira, sem rolagem */
  html, body { margin: 0; height: 100%; background: #24105a; overflow: hidden;
               touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<script>
// =====================================================
// DONKEY SEST - suba a torre sem ser atingido pelos barris
// =====================================================

// ---------- Tamanho do jogo ----------
// A torre se adapta ao aparelho quando uma partida começa:
//  - quanto mais alta a tela, mais andares a torre tem (de 8 a 12);
//  - quanto mais larga a tela, mais largos ficam os andares (de 360 até 720).
// Depois a torre é aumentada ou diminuída para caber na tela inteira, e o
// cenário (céu, cidade e chão) continua além das bordas da torre.
const MIN_ANDARES = 8, MAX_ANDARES = 12;   // quantidade de andares
const MAX_LARGURA = 720;                   // largura máxima dos andares
let L = 360, A = 740;                      // largura e altura do mundo do jogo
// Aparelho de toque (celular/tablet)? Então mostramos setas na tela
let controlesToque = false;
try {
  controlesToque = (window.matchMedia && matchMedia('(pointer: coarse)').matches) ||
                   (navigator.maxTouchPoints > 0 && !(window.matchMedia && matchMedia('(pointer: fine)').matches));
} catch (e) {}
let botoesTela = { s: 56, lista: [] };     // posição dos botões na tela (em pixels)
let DX = 0, DY = 0;                        // deslocamento dos menus (mantém tudo centralizado)
const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');
let dpr = 1, esc = 1, ox = 0, oy = 0;      // zoom e posição do mundo na tela
let vx0 = 0, vx1 = L, vy0 = 0, vy1 = A;    // parte do mundo que aparece na tela

// Posição dos botões da tela (em pixels): ◀ ▶ à esquerda e ▼ ▲ PULAR à direita
function calcularBotoes(w, h) {
  const s = Math.max(50, Math.min(76, Math.round(Math.min(w, h) * 0.16)));   // tamanho do botão
  const m = 14, g = 8, y = h - m - s;
  return { s: s, lista: [
    { id: 'esq',   x: m,                    y: y, w: s, h: s },
    { id: 'dir',   x: m + s + g,            y: y, w: s, h: s },
    { id: 'baixo', x: w - m - 3 * s - 2 * g, y: y, w: s, h: s },
    { id: 'cima',  x: w - m - 2 * s - g,    y: y, w: s, h: s },
    { id: 'pulo',  x: w - m - s,            y: y, w: s, h: s }
  ] };
}
// Altura que o jogo deixa livre embaixo para os botões (só em celular em pé;
// com o celular deitado os botões ficam nas laterais, onde sobra espaço)
function reservaToque(w, h) {
  if (!controlesToque || w > h) return 0;
  return calcularBotoes(w, h).s + 34;
}

function ajustarTela() {
  dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  tela.style.width = w + 'px';
  tela.style.height = h + 'px';
  tela.width = Math.round(w * dpr);
  tela.height = Math.round(h * dpr);
  botoesTela = calcularBotoes(w, h);
  const hh = h - reservaToque(w, h);        // altura que sobra para a torre
  esc = Math.min(w / L, hh / A);            // quanto o mundo cresce ou encolhe
  ox = (w - L * esc) / 2;                   // centraliza o mundo na tela
  oy = (hh - A * esc) / 2;
  vx0 = -ox / esc; vx1 = (w - ox) / esc;
  vy0 = -oy / esc; vy1 = (h - oy) / esc;
}
// Escolhe quantos andares e que largura a torre terá para esta tela
function definirMundo() {
  const w = window.innerWidth || 360, h = window.innerHeight || 740;
  const hh = h - reservaToque(w, h);                     // (menos a faixa dos botões, no celular)
  let n = Math.round((hh / 1.1 - 180) / 80) + 1;         // quantos andares cabem na altura da tela
  n = Math.max(MIN_ANDARES, Math.min(MAX_ANDARES, n));
  A = 180 + 80 * (n - 1);                                // cada andar a mais soma 80 de altura
  const zoom = Math.min(hh / A, w / 360);
  L = Math.min(MAX_LARGURA, Math.round(w / zoom));       // largura que sobra na tela
  DX = (L - 360) / 2;
  DY = (A - 740) / 2;
  montarTorre(n);
  ajustarTela();
}

// Se a janela mudar de tamanho: no menu a torre é refeita; durante a partida só o zoom muda
function aoRedimensionar() {
  if (estado === 'menu' || estado === 'dificuldade') preparar(); else ajustarTela();
}
window.addEventListener('resize', aoRedimensionar);
window.addEventListener('orientationchange', aoRedimensionar);

// Converte a posição do dedo/mouse na tela para a posição dentro do mundo do jogo
function paraMundo(e) {
  const r = tela.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / esc, y: (e.clientY - r.top - oy) / esc };
}

// ---------- Números do jogo (mude aqui para ajustar a dificuldade) ----------
const RAIO = 9;                // tamanho do barril
const VEL = 85;                // velocidade do herói andando
const VEL_ESCADA = 60;         // velocidade do herói na escada
const GRAVIDADE = 900;         // quão rápido as coisas caem
const FORCA_PULO = 330;        // força do pulo
const TEMPO_MARRETA = 8;       // segundos de marreta depois de pegar uma
const DURACAO_FURIA = 4;       // quanto tempo a fúria dura
const VEL_GARRAFA = 190;       // velocidade da garrafa flamejante
const DURACAO_BANANA = 3.5;    // duração do ataque de bananas (arremesso + animação do macaco)
const VIDA_BANANA = 12;        // segundos que a banana fica no chão antes de sumir
const MAX_BANANAS = 5;         // máximo de bananas no cenário ao mesmo tempo

// ---------- Dificuldades ----------
// vidas: vidas no começo | velBarril: velocidade dos barris | intervaloBarril, intervaloBanana:
// quanto menor, mais rápido o macaco joga | intervaloFuria: segundos entre as fúrias | velGarrafa: velocidade do fogo
// velVilao: velocidade dos movimentos do macaco (arremessos, ataque de banana e garrafas da fúria)
// O "médio" é um desafio de verdade; o "fácil" é mais calmo e o "difícil" tem um macaco muito mais rápido.
const NIVEIS = {
  facil:   { nome: 'FÁCIL',   vidas: 4, velBarril: 0.75, intervaloBarril: 1.4,  intervaloBanana: 1.6,  intervaloFuria: 20, velGarrafa: 0.8,  velVilao: 0.85 },
  medio:   { nome: 'MÉDIO',   vidas: 3, velBarril: 1.25, intervaloBarril: 0.75, intervaloBanana: 0.75, intervaloFuria: 12, velGarrafa: 1.2,  velVilao: 1.3 },
  dificil: { nome: 'DIFÍCIL', vidas: 2, velBarril: 1.5,  intervaloBarril: 0.55, intervaloBanana: 0.45, intervaloFuria: 9,  velGarrafa: 1.6,  velVilao: 1.7 }
};
const ORDEM_NIVEIS = ['facil', 'medio', 'dificil'];
let nivel = 'medio';           // dificuldade escolhida
let dif = NIVEIS.medio;        // números da dificuldade escolhida
let opcaoNivel = 1;            // opção marcada na tela de dificuldade

// ---------- A torre ----------
// Cada andar: y = altura do chão, x1/x2 = onde começa e termina,
// dir = para que lado os barris rolam (em direção ao buraco).
let andares = [];      // 0 = chão, o último é o topo (onde o vilão fica)
let escadas = [];      // cada escada liga o andar "base" ao andar de cima dele
let TOPO = 7;          // número do último andar

// Monta os n andares e as escadas, na largura L do mundo
function montarTorre(n) {
  const buraco = 60;                              // largura do buraco por onde os barris caem
  const larguraTopo = Math.round(L * 0.555);      // o andar do topo é mais curto
  andares = [];
  for (let i = 0; i < n; i++) {
    const y = A - 40 - 80 * i;                    // 80 de distância entre os andares
    if (i === 0) andares.push({ y: y, x1: 0, x2: L, dir: -1 });
    else if (i === n - 1) andares.push({ y: y, x1: 0, x2: larguraTopo, dir: 1 });
    else if (i % 2 === 1) andares.push({ y: y, x1: 0, x2: L - buraco, dir: 1 });
    else andares.push({ y: y, x1: buraco, x2: L, dir: -1 });
  }
  TOPO = n - 1;
  // posição das escadas em cada andar (como fração da largura, assim servem para qualquer tela)
  const padroes = [[250, 80], [120, 270], [240, 90], [100, 260]].map(function (p) {
    return p.map(function (x) { return x / 360; });
  });
  escadas = [];
  for (let k = 0; k < n - 2; k++) {
    for (const f of padroes[k % 4]) escadas.push({ x: Math.round(f * L), base: k });
    if (L > 520) escadas.push({ x: Math.round(L / 2), base: k });   // andares largos ganham uma escada no meio
  }
  escadas.push({ x: larguraTopo - 50, base: n - 2 });               // última escada, até o topo
}

// ---------- Estado do jogo ----------
let estado = 'menu';   // menu, dificuldade, jogo, perdeu ou ganhou
let jogador, barris, popups, martelos, particulas, bananas, garrafas, coracaoVida;
let vilao;             // o macaco: modo 'normal', 'banana' ou 'furia'
let vidas, pontos, recorde = 0, andarMax;
let tempoJogo, tempoSpawn, tremor, tempoFerido, invulneravel;
let tempoBanana, tempoFuria;   // contagens regressivas dos ataques do macaco
let martelo = 0;       // segundos de marreta que ainda restam
let relogio = 0;       // relógio geral (para animações)
let bloqueio = 0;      // evita recomeçar sem querer logo após o fim
let pausado = false;   // jogo pausado?
let opcaoPausa = 0;    // opção marcada no menu de pausa (0 = continuar, 1 = reiniciar)

try { recorde = parseInt(localStorage.getItem('donkeySestRecorde')) || 0; } catch (e) {}

function novoJogador() {
  return { x: Math.round(L / 2), y: andares[0].y, vx: 0, vy: 0, andar: 0,
           estado: 'chao', face: 1, anim: 0, escada: null, tEsc: 0, alvoX: 0 };
}

// Zera tudo para começar uma partida nova
function preparar() {
  definirMundo();                       // adapta a torre ao tamanho da tela
  jogador = novoJogador();
  barris = [];
  popups = [];
  particulas = [];
  bananas = [];
  garrafas = [];
  martelo = 0;
  // 3 marretas espalhadas pela torre (andar e posição, sempre dentro do andar)
  const n = andares.length;
  const andaresMarreta = [1, Math.round(n * 0.3), Math.round(n * 0.55)];
  const posMarreta = [0.53, 0.89, 0.8];
  martelos = andaresMarreta.map(function (f, i) {
    const a = andares[f];
    return { andar: f, x: Math.max(a.x1 + 14, Math.min(Math.round(posMarreta[i] * L), a.x2 - 14)), coletado: false };
  });
  // 1 coração de vida extra (só pode ser pego uma vez), num andar do meio para cima
  const fc = Math.round(n * 0.62);
  const ac = andares[fc];
  coracaoVida = { andar: fc, x: Math.max(40, ac.x1 + 25), coletado: false };
  vilao = { modo: 'normal', t: 0, lancados: 0 };
  tempoBanana = 5 * dif.intervaloBanana;
  tempoFuria = dif.intervaloFuria;
  vidas = dif.vidas;
  pontos = 0;
  andarMax = 0;
  tempoJogo = 0;
  tempoSpawn = 1.5;
  tremor = 0;
  tempoFerido = 0;
  invulneravel = 0;
  pausado = false;
  opcaoPausa = 0;
}
preparar();

// Do menu ou do fim de jogo, vai para a tela de escolha da dificuldade
function iniciar() {
  if (performance.now() < bloqueio) return;
  if (estado === 'menu' || estado === 'perdeu' || estado === 'ganhou') {
    preparar();                       // torre nova de fundo
    opcaoNivel = ORDEM_NIVEIS.indexOf(nivel);   // já marca a última dificuldade usada
    estado = 'dificuldade';
  }
}
// Começa a partida na dificuldade escolhida (0 = fácil, 1 = médio, 2 = difícil)
function comecar(i) {
  if (performance.now() < bloqueio) return;
  nivel = ORDEM_NIVEIS[i];
  dif = NIVEIS[nivel];
  opcaoNivel = i;
  preparar();
  estado = 'jogo';
}
// Botões da tela de dificuldade (posições dentro do painel)
const botoesNivel = [
  { x: 50, y: 232, w: 260, h: 74, i: 0, cor: '#4cd964', desc: 'Mais vidas, barris lentos e poucos ataques' },
  { x: 50, y: 320, w: 260, h: 74, i: 1, cor: '#ffd400', desc: 'Macaco mais rápido e barris mais seguidos' },
  { x: 50, y: 408, w: 260, h: 74, i: 2, cor: '#ff3b4e', desc: 'Macaco muito rápido, só 2 vidas. Boa sorte!' }
];
function nivelEm(p) {
  for (const b of botoesNivel) if (dentro(p, b, 0)) return b.i;
  return -1;
}

// ---------- Pausa ----------
const botaoPausa = { x: 188, y: 9, w: 62, h: 28 };           // botão PAUSE no topo
const botoesPausa = [                                         // botões do menu de pausa
  { x: 60, y: 365, w: 240, h: 44, txt: 'CONTINUAR JOGO' },
  { x: 60, y: 421, w: 240, h: 44, txt: 'REINICIAR PARTIDA' }
];

function pausar() {
  if (estado !== 'jogo' || pausado) return;
  pausado = true;
  opcaoPausa = 0;
  pedidoPulo = false;                 // limpa qualquer comando que estava pendente
  ponteiro = null;
  toque.esq = toque.dir = toque.cima = toque.baixo = toque.cimaBorda = false;
  soltarTodosBotoes();
}
function continuar() { pausado = false; }
function reiniciar() { preparar(); estado = 'jogo'; }        // preparar() já tira da pausa
function escolherPausa(i) { if (i === 0) continuar(); else reiniciar(); }

function dentro(p, r, margem) {
  margem = margem || 0;
  return p.x >= r.x - margem && p.x <= r.x + r.w + margem &&
         p.y >= r.y - margem && p.y <= r.y + r.h + margem;
}
function opcaoEm(p) {                 // qual botão do menu de pausa está sob o dedo/mouse
  for (let i = 0; i < botoesPausa.length; i++) if (dentro(p, botoesPausa[i], 0)) return i;
  return -1;
}

// ---------- Controles ----------
const teclas = {};
const toque = { esq: false, dir: false, cima: false, baixo: false, cimaBorda: false };
// Botões desenhados na tela (celular): quais estão apertados e qual dedo aperta qual
const botoes = { esq: false, dir: false, cima: false, baixo: false };
const dedosBotao = {};
function botaoEm(cx, cy) {                 // qual botão está sob a posição (px da tela)? (com folga de 6 px)
  for (const b of botoesTela.lista) {
    if (cx >= b.x - 6 && cx <= b.x + b.w + 6 && cy >= b.y - 6 && cy <= b.y + b.h + 6) return b.id;
  }
  return null;
}
function recalcularBotoes() {
  botoes.esq = botoes.dir = botoes.cima = botoes.baixo = false;
  for (const id in dedosBotao) if (dedosBotao[id] !== 'pulo') botoes[dedosBotao[id]] = true;
}
function apertarBotao(id, nome) {
  dedosBotao[id] = nome;
  if (nome === 'pulo') pedidoPulo = true;
  recalcularBotoes();
}
function soltarBotao(id) { delete dedosBotao[id]; recalcularBotoes(); }
function soltarTodosBotoes() { for (const id in dedosBotao) delete dedosBotao[id]; recalcularBotoes(); }
let pedidoPulo = false;
let ponteiro = null;

// Nome da tecla: letras pelo código físico (funciona mesmo com Caps Lock ligado)
// (também entende navegadores antigos, que usam outros nomes e números para as teclas)
function nomeTecla(e) {
  if (e.key === ' ' || e.key === 'Spacebar') return 'Space';
  if (e.code && e.code.indexOf('Key') === 0) return e.code;   // KeyW, KeyA, KeyS, KeyD, KeyP
  const antigos = { Left: 'ArrowLeft', Up: 'ArrowUp', Right: 'ArrowRight', Down: 'ArrowDown', Esc: 'Escape' };
  if (antigos[e.key]) return antigos[e.key];
  if (e.key && e.key.length === 1 && 'WASDP'.indexOf(e.key.toUpperCase()) >= 0) return 'Key' + e.key.toUpperCase();
  if (e.key && e.key !== 'Unidentified') return e.key;
  const porNumero = { 37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown', 32: 'Space', 13: 'Enter',
                      27: 'Escape', 65: 'KeyA', 68: 'KeyD', 83: 'KeyS', 87: 'KeyW', 80: 'KeyP' };
  return porNumero[e.keyCode] || e.key;
}

// O teclado só funciona se o jogo estiver "em foco". Em pré-visualizações e páginas
// incorporadas isso não é automático, então pedimos o foco ao carregar e a cada toque/clique.
tela.tabIndex = 0;
tela.style.outline = 'none';
function pedirFoco() { try { window.focus(); tela.focus({ preventScroll: true }); } catch (err) {} }
pedirFoco();

window.addEventListener('keydown', function (e) {
  const k = nomeTecla(e);
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(k)) e.preventDefault();
  const primeira = !teclas[k];          // só reage na primeira vez (ignora tecla segurada)
  teclas[k] = true;
  if (!primeira) return;
  if (pausado) {                        // no menu de pausa: W/S ou setas escolhem, Enter confirma
    if (k === 'ArrowUp' || k === 'KeyW') opcaoPausa = 0;      // (Espaço não confirma, para não retomar sem querer)
    else if (k === 'ArrowDown' || k === 'KeyS') opcaoPausa = 1;
    else if (k === 'Enter') escolherPausa(opcaoPausa);
    return;
  }
  if (estado === 'jogo') {
    if (k === 'Space' || k === 'Enter' || k === 'KeyW') pedidoPulo = true;   // W também pula
    else if (k === 'KeyP' || k === 'Escape') pausar();
  } else if (estado === 'dificuldade') {          // escolher a dificuldade
    if (k === 'ArrowUp' || k === 'KeyW') opcaoNivel = Math.max(0, opcaoNivel - 1);
    else if (k === 'ArrowDown' || k === 'KeyS') opcaoNivel = Math.min(2, opcaoNivel + 1);
    else if (k === '1' || k === '2' || k === '3') comecar(parseInt(k) - 1);
    else if (k === 'Space' || k === 'Enter') comecar(opcaoNivel);
  } else if (k === 'Space' || k === 'Enter') iniciar();
});
window.addEventListener('keyup', function (e) { teclas[nomeTecla(e)] = false; });
window.addEventListener('blur', function () { for (const k in teclas) teclas[k] = false; soltarTodosBotoes(); });

// Toque / mouse: arrastar anda e sobe; toque rápido pula
tela.addEventListener('contextmenu', function (e) { e.preventDefault(); });
tela.addEventListener('pointerdown', function (e) {
  pedirFoco();                                     // (sem preventDefault: ele impedia o teclado de receber o foco)
  const p = paraMundo(e);
  if (pausado) {                                   // menu de pausa: só os botões funcionam
    const o = opcaoEm({ x: p.x - DX, y: p.y - DY });
    if (o >= 0) escolherPausa(o);
    return;
  }
  if (estado === 'jogo' && dentro({ x: p.x - DX, y: p.y }, botaoPausa, 8)) { pausar(); return; }
  if (estado === 'dificuldade') {                  // toque num botão de dificuldade começa o jogo
    const i = nivelEm({ x: p.x - DX, y: p.y - DY });
    if (i >= 0) comecar(i);
    return;
  }
  if (estado !== 'jogo') { iniciar(); return; }
  if (controlesToque) {                            // dedo em cima de um botão da tela?
    const r = tela.getBoundingClientRect();
    const nome = botaoEm(e.clientX - r.left, e.clientY - r.top);
    if (nome) {
      try { tela.setPointerCapture(e.pointerId); } catch (err) {}
      apertarBotao(e.pointerId, nome);
      return;
    }
  }
  if (ponteiro && e.pointerId !== ponteiro.id) { pedidoPulo = true; return; } // 2º dedo = pulo
  try { tela.setPointerCapture(e.pointerId); } catch (err) {}
  ponteiro = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), moveu: false };
});
tela.addEventListener('pointermove', function (e) {
  if (pausado) {                                   // passar o mouse sobre um botão marca a opção
    const q = paraMundo(e);
    const o = opcaoEm({ x: q.x - DX, y: q.y - DY });
    if (o >= 0) opcaoPausa = o;
    return;
  }
  if (estado === 'dificuldade') {                  // mouse sobre um botão marca a opção
    const q = paraMundo(e);
    const i = nivelEm({ x: q.x - DX, y: q.y - DY });
    if (i >= 0) opcaoNivel = i;
    return;
  }
  if (dedosBotao[e.pointerId]) {                   // dedo escorregou para outro botão de direção
    const r = tela.getBoundingClientRect();
    const nome = botaoEm(e.clientX - r.left, e.clientY - r.top);
    if (nome !== dedosBotao[e.pointerId]) {
      soltarBotao(e.pointerId);
      if (nome && nome !== 'pulo') apertarBotao(e.pointerId, nome);
    }
    return;
  }
  if (!ponteiro || e.pointerId !== ponteiro.id) return;
  const dx = e.clientX - ponteiro.x0, dy = e.clientY - ponteiro.y0;
  if (Math.hypot(dx, dy) > 12) ponteiro.moveu = true;
  toque.esq = dx < -12;
  toque.dir = dx > 12;
  const cimaNova = dy < -22;
  if (cimaNova && !toque.cima) toque.cimaBorda = true; // arrastou para cima agora
  toque.cima = cimaNova;
  toque.baixo = dy > 22;
});
function fimToque(e) {
  if (dedosBotao[e.pointerId]) { soltarBotao(e.pointerId); return; }   // soltou um botão da tela
  if (!ponteiro || e.pointerId !== ponteiro.id) return;
  if (!ponteiro.moveu && performance.now() - ponteiro.t0 < 300 && estado === 'jogo' && !pausado) pedidoPulo = true;
  ponteiro = null;
  toque.esq = toque.dir = toque.cima = toque.baixo = false;
}
tela.addEventListener('pointerup', fimToque);
tela.addEventListener('pointercancel', fimToque);

// ---------- Regras do jogo ----------
function escadaPerto(x, base) {
  return escadas.find(function (e) { return e.base === base && Math.abs(e.x - x) <= 10; });
}

// Retângulo do corpo do herói e área de golpe da marreta (um pouco à frente dele)
function heroiRet() {
  const j = jogador;
  return { l: j.x - 6, r: j.x + 6, t: j.y - 26, b: j.y - 1 };
}
function zonaMarreta() {
  const j = jogador;
  const x2 = j.x + j.face * 28;
  return { l: Math.min(j.x - 7, x2), r: Math.max(j.x + 7, x2), t: j.y - 38, b: j.y };
}
function sobrepoe(a, b) { return a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t; }

function jogarBarril() {
  barris.push({ x: 78, y: andares[TOPO].y - RAIO, vx: 0, vy: 0, dir: 1,
                andar: TOPO, caindo: false, rot: 0, pontuou: false });
}

function atualizarJogador(dt) {
  const j = jogador;
  // setas e WASD fazem a mesma coisa
  const esq = teclas['ArrowLeft'] || teclas['KeyA'] || toque.esq || botoes.esq;
  const dir = teclas['ArrowRight'] || teclas['KeyD'] || toque.dir || botoes.dir;
  const cima = teclas['ArrowUp'] || teclas['KeyW'] || toque.cima || botoes.cima;
  const baixo = teclas['ArrowDown'] || teclas['KeyS'] || toque.baixo || botoes.baixo;

  if (j.estado === 'chao') {
    // andar para os lados
    let m = 0;
    if (esq) m -= 1;
    if (dir) m += 1;
    j.x += m * VEL * dt;
    if (m !== 0) { j.face = m; j.anim += dt * 10; }
    const a = andares[j.andar];
    j.x = Math.max(a.x1 + 7, Math.min(a.x2 - 7, j.x));

    // subir/descer escada e pular (funciona igual com ou sem a marreta)
    const subir = escadaPerto(j.x, j.andar);
    const descer = j.andar > 0 ? escadaPerto(j.x, j.andar - 1) : null;
    if (cima && subir) {
      j.estado = 'escada'; j.escada = subir; j.x = subir.x;
    } else if (baixo && descer) {
      j.estado = 'escada'; j.escada = descer; j.x = descer.x;
    } else if (pedidoPulo || (toque.cimaBorda && !subir)) {
      j.estado = 'ar'; j.vy = -FORCA_PULO; j.vx = m * VEL;
    }
  } else if (j.estado === 'ar') {
    j.x += j.vx * dt;
    const a = andares[j.andar];
    j.x = Math.max(a.x1 + 7, Math.min(a.x2 - 7, j.x));
    j.vy += GRAVIDADE * dt;
    j.y += j.vy * dt;
    if (j.y >= a.y) { j.y = a.y; j.vy = 0; j.vx = 0; j.estado = 'chao'; }
  } else if (j.estado === 'escada') {
    const yBase = andares[j.escada.base].y;
    const yTopo = andares[j.escada.base + 1].y;
    let m = 0;
    if (cima) m = -1;
    if (baixo) m = 1;
    j.y += m * VEL_ESCADA * dt;
    if (m !== 0) j.anim += dt * 10;
    if (j.y <= yTopo) {            // chegou no andar de cima
      j.y = yTopo; j.estado = 'chao'; j.andar = j.escada.base + 1;
      if (j.andar > andarMax) andarMax = j.andar;
      if (j.andar === TOPO) ganhar();
    } else if (j.y >= yBase) {     // voltou para o andar de baixo
      j.y = yBase; j.estado = 'chao'; j.andar = j.escada.base;
    }
  } else if (j.estado === 'escorrega') {
    // pisou na banana: perde o controle e desliza para frente
    j.tEsc += dt;
    const a = andares[j.andar];
    j.x += j.face * 90 * dt;
    j.x = Math.max(a.x1 + 7, Math.min(a.x2 - 7, j.x));
    if (j.tEsc >= 0.6) {
      if (j.andar > 0) {           // existe andar embaixo: cai para ele
        const baixoA = andares[j.andar - 1];
        j.alvoX = Math.max(baixoA.x1 + 7, Math.min(baixoA.x2 - 7, j.x));
        j.estado = 'queda'; j.vy = 0;
      } else {                     // já está no chão: só levanta
        j.estado = 'chao';
      }
    }
  } else if (j.estado === 'queda') {
    // caindo para o andar imediatamente inferior
    const baixoA = andares[j.andar - 1];
    const dx = j.alvoX - j.x;
    j.x += Math.sign(dx) * Math.min(Math.abs(dx), 200 * dt);
    j.vy += GRAVIDADE * dt;
    j.y += j.vy * dt;
    if (j.y >= baixoA.y) {
      j.y = baixoA.y; j.vy = 0; j.x = j.alvoX; j.andar -= 1; j.estado = 'chao';
      tremor = 0.15;
    }
  }
}

function atualizarBarris(dt) {
  const vel = (70 + 6 * andarMax) * dif.velBarril; // barris ficam mais rápidos conforme você sobe (e na dificuldade alta)
  for (let i = barris.length - 1; i >= 0; i--) {
    const b = barris[i];
    if (!b.caindo) {
      // barril rolando no andar
      const xAntes = b.x;
      b.x += b.dir * vel * dt;
      b.rot += b.dir * vel * dt / RAIO;
      // às vezes o barril desce por uma escada
      for (const e of escadas) {
        if (e.base + 1 === b.andar && (xAntes - e.x) * (b.x - e.x) <= 0 && Math.random() < 0.25) {
          b.caindo = true; b.vx = 0; b.vy = 0; b.x = e.x;
        }
      }
      const a = andares[b.andar];
      if (!b.caindo && (b.x < a.x1 || b.x > a.x2)) {
        if (b.andar === 0) { if (b.x < -RAIO) barris.splice(i, 1); continue; }
        b.caindo = true; b.vx = b.dir * vel * 0.5; b.vy = 0; // cai pelo buraco
      }
    } else {
      // barril caindo até o andar de baixo
      const yAntes = b.y;
      b.vy += GRAVIDADE * dt;
      b.y += b.vy * dt;
      b.x += b.vx * dt;
      b.rot += 0.2;
      for (let k = b.andar - 1; k >= 0; k--) {
        const a = andares[k];
        if (b.x >= a.x1 && b.x <= a.x2 && yAntes + RAIO <= a.y && b.y + RAIO >= a.y) {
          b.y = a.y - RAIO; b.andar = k; b.caindo = false; b.dir = a.dir; b.vy = 0; b.vx = 0;
          break;
        }
      }
      if (b.y > A + 40) barris.splice(i, 1);
    }
  }
}

// Verifica se um círculo (barril ou garrafa) encostou num retângulo
// (folga positiva = mais generoso, negativa = mais difícil de acertar)
function colide(b, r, folga) {
  const cx = Math.max(r.l, Math.min(b.x, r.r));
  const cy = Math.max(r.t, Math.min(b.y, r.b));
  const dx = b.x - cx, dy = b.y - cy;
  const raio = RAIO + folga;
  return dx * dx + dy * dy < raio * raio;
}

// Pedacinhos voando quando algo é quebrado
function estilhacos(x, y, cor) {
  for (let k = 0; k < 8; k++) {
    particulas.push({ x: x, y: y, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 140, t: 0, cor: cor });
  }
}

// Quebra um barril com a marreta: pontos, textinho e pedacinhos voando
function destruir(i) {
  const b = barris[i];
  pontos += 300;
  popups.push({ x: b.x, y: b.y - 14, txt: '+300', t: 0 });
  estilhacos(b.x, b.y, '#b5651d');
  barris.splice(i, 1);
}

function verificarBarris() {
  const j = jogador;
  const r = heroiRet();
  const forte = martelo > 0;
  const zona = zonaMarreta();
  for (let i = barris.length - 1; i >= 0; i--) {
    const b = barris[i];
    if (forte) {                       // com a marreta nenhum barril machuca: todos quebram
      if (colide(b, zona, 2) || colide(b, r, 0)) destruir(i);
      continue;
    }
    // pulou por cima de um barril: ganha pontos
    if (!b.pontuou && !b.caindo && j.estado === 'ar' && b.andar === j.andar &&
        Math.abs(b.x - j.x) < 12 && j.y < b.y - RAIO) {
      b.pontuou = true;
      pontos += 100;
      popups.push({ x: j.x, y: j.y - 34, txt: '+100', t: 0 });
    }
    if (invulneravel <= 0 && colide(b, r, -2)) { ferido(); return; }
  }
}

function ferido() {
  vidas -= 1;
  tremor = 0.4;
  tempoFerido = 1.1;
  jogador.estado = 'ferido';
}

// Dano da garrafa flamejante: perde 1 vida mas fica no mesmo lugar (sem reiniciar a fase)
function danoFogo() {
  vidas -= 1;
  tremor = 0.4;
  popups.push({ x: jogador.x, y: jogador.y - 40, txt: '-1 VIDA', t: 0 });
  if (vidas <= 0) {                    // era a última vida: fim de jogo
    tempoFerido = 1.1;
    jogador.estado = 'ferido';
  } else {
    invulneravel = 1.5;                // pisca um pouco e não leva dano de novo na mesma hora
  }
}

function ganhar() {
  const bonus = Math.max(0, Math.round(1000 - tempoJogo * 8)); // quanto mais rápido, mais pontos
  pontos += bonus;
  popups.push({ x: L / 2, y: 120, txt: 'Bônus de tempo +' + bonus, t: 0 });
  salvarRecorde();
  estado = 'ganhou';
  bloqueio = performance.now() + 800;
}

function salvarRecorde() {
  if (pontos > recorde) {
    recorde = pontos;
    try { localStorage.setItem('donkeySestRecorde', String(recorde)); } catch (e) {}
  }
}

// Pega a marreta quando o herói encosta nela
function pegarMarretas() {
  const j = jogador;
  for (const m of martelos) {
    if (!m.coletado && j.andar === m.andar && j.estado !== 'escada' && j.estado !== 'queda' &&
        Math.abs(j.x - m.x) < 12) {
      m.coletado = true;
      martelo = TEMPO_MARRETA;
      popups.push({ x: j.x, y: j.y - 40, txt: 'MARRETA!', t: 0 });
    }
  }
}

// Pega o coração de vida extra (só uma vez)
function pegarCoracao() {
  const c = coracaoVida, j = jogador;
  if (c.coletado || j.estado === 'queda' || j.estado === 'ferido') return;
  const yc = andares[c.andar].y;
  const area = { l: c.x - 10, r: c.x + 10, t: yc - 34, b: yc - 8 };
  if (sobrepoe(heroiRet(), area)) {
    c.coletado = true;                 // some do mapa e não dá vida de novo
    vidas += 1;
    popups.push({ x: c.x, y: yc - 40, txt: '+1 VIDA', t: 0 });
  }
}

// ---------- Ataque de bananas ----------
// O macaco joga uma banana que voa até um ponto do cenário e fica no chão.
function lancarBanana() {
  let alvoA = 0, alvoX = 180;
  for (let n = 0; n < 12; n++) {       // sorteia andar e posição (longe do herói)
    alvoA = Math.floor(Math.random() * TOPO);          // andares 0 até TOPO-1
    const a = andares[alvoA];
    alvoX = a.x1 + 20 + Math.random() * (a.x2 - a.x1 - 40);
    if (!(alvoA === jogador.andar && Math.abs(alvoX - jogador.x) < 45)) break;
  }
  const x0 = 62, y0 = andares[TOPO].y - 70;            // mão do macaco
  bananas.push({ estado: 'voo', t: 0, x0: x0, y0: y0, xt: alvoX, yt: andares[alvoA].y,
                 x: x0, y: y0, andar: alvoA, vida: VIDA_BANANA, rot: 0 });
  if (bananas.length > MAX_BANANAS) bananas.shift();   // a mais antiga some
}

function atualizarBananas(dt) {
  for (let i = bananas.length - 1; i >= 0; i--) {
    const b = bananas[i];
    if (b.estado === 'voo') {
      b.t += dt / 0.9;                                  // voo dura 0,9 s
      const u = Math.min(1, b.t);
      b.x = b.x0 + (b.xt - b.x0) * u;
      b.y = b.y0 + (b.yt - b.y0) * u - 90 * 4 * u * (1 - u);   // curva no ar
      b.rot += dt * 12;
      if (u >= 1) { b.estado = 'chao'; b.x = b.xt; b.y = b.yt; b.rot = 0; }
    } else {
      b.vida -= dt;
      if (b.vida <= 0) bananas.splice(i, 1);
    }
  }
}

// O herói escorrega: perde o controle por um tempo e cai para o andar de baixo (se houver)
function escorregar() {
  const j = jogador;
  j.estado = 'escorrega'; j.tEsc = 0; j.vx = 0; j.vy = 0;
  j.y = andares[j.andar].y;
  popups.push({ x: j.x, y: j.y - 40, txt: 'Escorregou!', t: 0 });
}

function verificarBananas() {
  const j = jogador;
  if (j.estado === 'ferido' || j.estado === 'escada' || j.estado === 'escorrega' || j.estado === 'queda') return;
  const r = heroiRet();
  const zona = zonaMarreta();
  for (let i = bananas.length - 1; i >= 0; i--) {
    const b = bananas[i];
    if (b.estado !== 'chao') continue;          // banana voando ainda não escorrega ninguém
    const rb = { l: b.x - 8, r: b.x + 8, t: b.y - 8, b: b.y };
    if (martelo > 0) {                          // a marreta esmaga a banana
      if (sobrepoe(zona, rb) || sobrepoe(r, rb)) { estilhacos(b.x, b.y - 4, '#ffd23a'); bananas.splice(i, 1); }
      continue;
    }
    if (sobrepoe(r, rb)) {                      // pulando por cima, o herói não encosta
      bananas.splice(i, 1);                     // a banana some (um contato = um escorregão)
      escorregar();
      return;
    }
  }
}

// ---------- Garrafas flamejantes (fúria) ----------
// A direção é calculada UMA vez, na hora do arremesso: a garrafa não persegue o herói.
function lancarGarrafa() {
  const j = jogador;
  const x0 = 62, y0 = andares[TOPO].y - 70;             // mão do macaco
  const dx = j.x - x0, dy = (j.y - 16) - y0;            // direção até onde o herói está AGORA
  const d = Math.hypot(dx, dy) || 1;
  const vg = VEL_GARRAFA * dif.velGarrafa;
  garrafas.push({ x: x0, y: y0, vx: dx / d * vg, vy: dy / d * vg, rot: 0 });
}

function atualizarGarrafas(dt) {
  for (let i = garrafas.length - 1; i >= 0; i--) {
    const g = garrafas[i];
    g.x += g.vx * dt;
    g.y += g.vy * dt;
    g.rot += dt * 10;
    if (g.x < -60 || g.x > L + 60 || g.y < -80 || g.y > A + 60) garrafas.splice(i, 1);
  }
}

function verificarGarrafas() {
  const j = jogador;
  if (j.estado === 'ferido') return;
  const r = heroiRet();
  const zona = zonaMarreta();
  for (let i = garrafas.length - 1; i >= 0; i--) {
    const g = garrafas[i];
    if (martelo > 0) {                                  // a marreta também quebra a garrafa
      if (colide(g, zona, -2) || colide(g, r, -2)) {
        pontos += 300;
        popups.push({ x: g.x, y: g.y - 14, txt: '+300', t: 0 });
        estilhacos(g.x, g.y, '#ff9a2e');
        garrafas.splice(i, 1);
      }
      continue;
    }
    if (invulneravel <= 0 && colide(g, r, -2)) {
      garrafas.splice(i, 1);                            // a garrafa some: uma batida = um dano só
      danoFogo();
      return;
    }
  }
}

// ---------- O macaco: fúria e ataque de bananas ----------
function atualizarVilao(dt) {
  const v = vilao;
  tempoFuria -= dt;
  if (tempoFuria <= 0 && v.modo !== 'furia') {          // hora de enfurecer (a cada 15 s)
    v.modo = 'furia'; v.t = 0; v.lancados = 0;
    tempoFuria += dif.intervaloFuria;
  }
  if (v.modo === 'furia') {
    v.t += dt;
    // macaco mais rápido solta as garrafas mais cedo (a fúria continua durando 4 s)
    if (v.lancados === 0 && v.t >= 1.0 / dif.velVilao) { lancarGarrafa(); v.lancados = 1; }   // 1ª garrafa
    if (v.lancados === 1 && v.t >= 2.5 / dif.velVilao) { lancarGarrafa(); v.lancados = 2; }   // 2ª garrafa
    if (v.t >= DURACAO_FURIA) { v.modo = 'normal'; v.t = 0; }                 // 4 s: acabou
  } else if (v.modo === 'banana') {
    v.t += dt * Math.max(1, dif.velVilao);              // macaco mais rápido termina o ataque de banana antes
    if (v.lancados === 0 && v.t >= 0.35) { lancarBanana(); v.lancados = 1; }
    if (v.lancados === 1 && v.t >= 0.65) { lancarBanana(); v.lancados = 2; }
    if (v.t >= DURACAO_BANANA) {                        // terminou de comer
      v.modo = 'normal'; v.t = 0;
      tempoBanana = (6 + Math.random() * 3) * dif.intervaloBanana;
    }
  } else {
    if (tempoBanana > 0) tempoBanana -= dt;
    // só começa o ataque de bananas se der tempo de terminar antes da próxima fúria
    if (tempoBanana <= 0 && tempoFuria > DURACAO_BANANA + 0.3) {
      v.modo = 'banana'; v.t = 0; v.lancados = 0;
    }
  }
}

function atualizar(dt) {
  if (pausado) return;                 // pausado: nada se mexe e nenhum tempo corre
  for (const p of popups) p.t += dt;
  popups = popups.filter(function (p) { return p.t < 1.2; });
  for (const p of particulas) { p.t += dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particulas = particulas.filter(function (p) { return p.t < 0.6; });
  if (tremor > 0) tremor -= dt;
  if (estado !== 'jogo') return;

  tempoJogo += dt;
  if (invulneravel > 0) invulneravel -= dt;

  atualizarVilao(dt);
  atualizarBananas(dt);
  atualizarGarrafas(dt);

  if (tempoFerido > 0) {
    // herói caiu: espera um pouco e volta ao início
    tempoFerido -= dt;
    if (tempoFerido <= 0) {
      if (vidas <= 0) {
        salvarRecorde();
        estado = 'perdeu';
        bloqueio = performance.now() + 800;
      } else {
        jogador = novoJogador();
        barris = [];
        bananas = [];
        garrafas = [];
        invulneravel = 1.5;
        tempoSpawn = 1.2;
      }
    }
  } else {
    // o vilão joga barris cada vez mais seguidos (menos quando está ocupado com bananas ou fúria)
    if (vilao.modo === 'normal') {
      tempoSpawn -= dt;
      if (tempoSpawn <= 0) {
        jogarBarril();
        tempoSpawn = (Math.max(1.1, 2.6 - 0.25 * andarMax) + Math.random() * 0.6) * dif.intervaloBarril;
      }
    }
    atualizarJogador(dt);
    if (martelo > 0) martelo = Math.max(0, martelo - dt);
    pegarMarretas();
    pegarCoracao();
    if (estado === 'jogo') {
      atualizarBarris(dt);
      verificarBarris();
      verificarBananas();
      verificarGarrafas();
    }
  }
  pedidoPulo = false;
  toque.cimaBorda = false;
}

// =====================================================
// DESENHO
// =====================================================
function texto(t, x, y, tam, cor, alinhar) {
  ctx.font = 'bold ' + tam + 'px sans-serif';
  ctx.fillStyle = cor;
  ctx.textAlign = alinhar || 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(t, x, y);
}

// Prédios da cidade: gerados uma vez só (números "aleatórios" fixos, sempre iguais).
// Cobrem uma faixa bem larga, para o cenário continuar nas laterais em telas largas.
function gerarPredios(semente, alturaMin, alturaMax, larguraMin) {
  let s = semente;
  function aleatorio() { s = (s * 16807) % 2147483647; return s / 2147483647; }
  const lista = [];
  let x = -1500;
  while (x < 1860) {
    const w = larguraMin + Math.floor(aleatorio() * 26);
    const h = alturaMin + Math.floor(aleatorio() * (alturaMax - alturaMin));
    const luzes = [];
    for (let i = 0; i < 4; i++) {
      const dy = 12 + Math.floor(aleatorio() * h * 0.7);
      luzes.push({ dx: 3 + Math.floor(aleatorio() * Math.max(1, w - 8)), dy: dy,
                   h: Math.max(2, Math.min(6 + Math.floor(aleatorio() * 28), h - dy - 2)),
                   cor: aleatorio() < 0.5 ? '#38d6ff' : '#5a7dff' });
    }
    lista.push({ x: x, w: w, h: h, antena: aleatorio() < 0.45 ? 10 + Math.floor(aleatorio() * 28) : 0, luzes: luzes });
    x += w - 3 + Math.floor(aleatorio() * 6);
  }
  return lista;
}
const prediosFundo = gerarPredios(11, 180, 430, 16);   // prédios de trás (mais claros)
const prediosFrente = gerarPredios(7, 240, 560, 20);   // prédios da frente (mais escuros)

function desenharPredios(lista, cor, alpha) {
  for (const p of lista) {
    if (p.x + p.w < vx0 - 10 || p.x > vx1 + 10) continue;   // só desenha o que aparece na tela
    const topo = (A - 30) - p.h * (A / 740);       // prédios crescem junto com a torre
    ctx.fillStyle = cor;
    ctx.fillRect(p.x, topo, p.w, p.h);
    if (p.antena) ctx.fillRect(p.x + Math.floor(p.w / 2), topo - p.antena, 2, p.antena);
    ctx.globalAlpha = alpha;                        // luzes de neon nas janelas
    for (const l of p.luzes) { ctx.fillStyle = l.cor; ctx.fillRect(p.x + l.dx, topo + l.dy, 2, l.h); }
    ctx.globalAlpha = 1;
  }
}

// Nuvem feita de blocos, no estilo "pixel"
function nuvem(x, y, w) {
  ctx.fillStyle = '#8a7be0';
  ctx.fillRect(x, y, w, 6);
  ctx.fillRect(x + 8, y - 6, w - 18, 6);
  ctx.fillRect(x + 18, y - 12, w - 40, 6);
  ctx.fillStyle = '#6a58c4';
  ctx.fillRect(x + 4, y + 6, w - 8, 3);
}

function desenharFundo() {
  const largura = vx1 - vx0 + 20;
  // céu roxo que vira rosa perto do chão (cobre toda a tela)
  const chao = A - 30;                      // altura onde começa o chão de pedras
  const g = ctx.createLinearGradient(0, 0, 0, chao);
  g.addColorStop(0, '#24105a');
  g.addColorStop(0.5, '#4a2397');
  g.addColorStop(0.85, '#c0489f');
  g.addColorStop(1, '#ff7cc0');
  ctx.fillStyle = g;
  ctx.fillRect(vx0 - 10, vy0 - 10, largura, vy1 - vy0 + 20);
  // listras horizontais no céu
  ctx.fillStyle = 'rgba(190,150,255,0.14)';
  for (let y = 260 * A / 740; y < chao - 10; y += 22) ctx.fillRect(vx0 - 10, y, largura, 4 + (y - 260) / 60);
  // nuvens devagarinho para o lado
  const nuvens = [[20, 130, 70], [190, 190, 90], [260, 100, 60], [90, 300, 80], [300, 420, 70], [40, 520, 64]];
  const faixa = (vx1 - vx0) + 160;
  for (const n of nuvens) nuvem(((n[0] * faixa / L + relogio * 5) % faixa) + vx0 - 90, n[1] * A / 740, n[2]);
  // cidade
  desenharPredios(prediosFundo, '#33206e', 0.5);
  desenharPredios(prediosFrente, '#150b32', 0.9);
  // chão de pedras roxas
  ctx.fillStyle = '#2b2158';
  ctx.fillRect(vx0 - 10, chao, largura, vy1 - chao + 10);
  ctx.fillStyle = '#9b5cff';
  ctx.fillRect(vx0 - 10, chao, largura, 4);
  ctx.fillStyle = '#41367d';
  for (let y = chao + 8, linha = 0; y < vy1 + 10; y += 10, linha++) {
    for (let x = Math.floor((vx0 - 20) / 20) * 20 + (linha % 2) * 10; x < vx1 + 20; x += 20) ctx.fillRect(x, y, 16, 7);
  }
}

function desenharAndares() {
  for (const a of andares) {
    const w = a.x2 - a.x1;
    ctx.fillStyle = '#5a2fa8';
    ctx.fillRect(a.x1, a.y, w, 10);
    ctx.fillStyle = '#2f1a66';
    for (let x = a.x1 + 4; x < a.x2 - 8; x += 16) ctx.fillRect(x, a.y + 4, 8, 3);
    ctx.fillStyle = '#ff5fd2';             // faixa de neon rosa em cima
    ctx.fillRect(a.x1, a.y, w, 2);
  }
}

function desenharEscadas() {
  for (const e of escadas) {
    const yb = andares[e.base].y, yt = andares[e.base + 1].y;
    ctx.fillStyle = '#5de0ff';
    ctx.fillRect(e.x - 7, yt - 6, 2, yb - yt + 6);
    ctx.fillRect(e.x + 5, yt - 6, 2, yb - yt + 6);
    for (let y = yt + 4; y < yb; y += 8) ctx.fillRect(e.x - 7, y, 14, 2);
  }
}

function estrela(x, y, r, cor) {
  ctx.fillStyle = cor;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? r : r * 0.45;
    ctx.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr);
  }
  ctx.closePath();
  ctx.fill();
}

// Uma banana (centro em 0,0), usada no baú, no chão, no ar e na mão do macaco
function bananaForma() {
  ctx.fillStyle = '#ffd23a';
  ctx.strokeStyle = '#a8780a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-8, -3);
  ctx.quadraticCurveTo(0, 12, 9, -5);     // lado de baixo (curvo)
  ctx.quadraticCurveTo(0, 2, -8, -3);     // lado de cima
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#5a3a10';              // pontinhas marrons
  ctx.fillRect(8, -7, 2, 3);
  ctx.fillRect(-9, -4, 2, 2);
}

// Baú de madeira cheio de bananas (o prêmio no topo)
function desenharBau(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = 0.18 + 0.08 * Math.sin(relogio * 4);   // brilho dourado atrás
  ctx.fillStyle = '#ffd400';
  ctx.beginPath(); ctx.arc(0, -20, 26, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#6b3d14';                                // tampa aberta (atrás)
  ctx.beginPath(); ctx.moveTo(-17, -16); ctx.lineTo(-14, -32); ctx.lineTo(14, -32); ctx.lineTo(17, -16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd400'; ctx.fillRect(-14, -33, 28, 2);
  const monte = [[-10, -20, -0.5], [-3, -25, 0.2], [5, -22, 0.9], [11, -19, -1.2], [1, -19, 0.1]];
  for (const p of monte) {                                  // bananas aparecendo
    ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(p[2]); ctx.scale(1.15, 1.15); bananaForma(); ctx.restore();
  }
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-17, -16, 34, 16);   // corpo do baú
  ctx.fillStyle = '#6b3d14'; ctx.fillRect(-17, -9, 34, 2);
  ctx.fillStyle = '#ffd400';                                    // ferragens douradas
  ctx.fillRect(-17, -16, 34, 3); ctx.fillRect(-17, -3, 34, 3);
  ctx.fillRect(-17, -16, 3, 16); ctx.fillRect(14, -16, 3, 16);
  ctx.fillRect(-4, -14, 8, 8);                                  // fechadura
  ctx.fillStyle = '#3a2000'; ctx.fillRect(-1, -11, 2, 4);
  const b1 = Math.sin(relogio * 5) * 0.5 + 0.5, b2 = Math.sin(relogio * 5 + 2) * 0.5 + 0.5;
  estrela(-20, -34, 2 + 3 * b1, '#fff7b0');                     // brilhos
  estrela(20, -28, 2 + 3 * b2, '#fff7b0');
  ctx.restore();
}

function desenharMeta() {
  // baú de bananas no topo, perto da última escada
  const y = andares[TOPO].y;
  const x = andares[TOPO].x2 - 24;
  desenharBau(x, y);
  texto('TOPO', x, y - 46, 11, '#ffd400');
}

function desenharBarrilNo(x, y, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = '#b5651d';
  ctx.beginPath(); ctx.arc(0, 0, RAIO, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#5a3210'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#e0b060'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, RAIO * 0.55, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-RAIO, 0); ctx.lineTo(RAIO, 0); ctx.stroke();
  ctx.restore();
}

// Marreta desenhada apontando para cima, com a base da mão em (0,0)
function formaMarreta() {
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-1.5, -18, 3, 18);   // cabo
  ctx.fillStyle = '#c9ccd6'; ctx.fillRect(-7, -26, 14, 9);     // cabeça
  ctx.fillStyle = '#ff4f5e'; ctx.fillRect(-7, -26, 3, 9); ctx.fillRect(4, -26, 3, 9);
}

// Marretas espalhadas pela torre (flutuam e brilham até serem pegas)
function desenharMartelos() {
  for (const m of martelos) {
    if (m.coletado) continue;
    const y = andares[m.andar].y - 6 + Math.sin(relogio * 4 + m.x) * 2;
    ctx.save();
    ctx.translate(m.x, y);
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#ffd400';
    ctx.beginPath(); ctx.arc(0, -14, 16, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    formaMarreta();
    ctx.restore();
  }
}

// Coração de vida extra: flutua e brilha até ser pego
function desenharCoracaoVida() {
  const c = coracaoVida;
  if (c.coletado) return;
  const yc = andares[c.andar].y;
  const y = yc - 32 + Math.sin(relogio * 4) * 3;                // flutua
  ctx.globalAlpha = 0.25 + 0.15 * Math.sin(relogio * 6);        // brilho pulsando
  ctx.fillStyle = '#ff7aa0';
  ctx.beginPath(); ctx.arc(c.x, y + 9, 17, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  coracao(c.x, y, 20, '#ff3b4e');
  ctx.fillStyle = 'rgba(255,255,255,0.7)';                      // reflexo
  ctx.fillRect(c.x - 6, y + 4, 3, 3);
  const b = Math.sin(relogio * 7) * 0.5 + 0.5;
  estrela(c.x + 13, y - 2, 1.5 + 2.5 * b, '#fff7b0');           // brilhinho
}

// Bananas no ar e no chão
function desenharBananas() {
  for (const b of bananas) {
    if (b.estado === 'chao' && b.vida < 2.5 && Math.floor(relogio * 8) % 2 === 0) continue; // pisca antes de sumir
    ctx.save();
    if (b.estado === 'voo') { ctx.translate(b.x, b.y); ctx.rotate(b.rot); }
    else ctx.translate(b.x, b.y - 5);
    ctx.scale(1.3, 1.3);
    bananaForma();
    ctx.restore();
  }
}

// Garrafa com fogo no gargalo (centro em 0,0, gargalo para cima)
function garrafaForma() {
  ctx.fillStyle = '#2e9d5f'; ctx.fillRect(-4, -3, 8, 11);        // corpo
  ctx.fillRect(-2, -8, 4, 6);                                      // gargalo
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(-3, -1, 2, 7);  // reflexo
  ctx.fillStyle = '#f2e6c8'; ctx.fillRect(-3, -9, 6, 2);           // pano
  const f = 1 + 0.25 * Math.sin(relogio * 40);                     // chama tremendo
  ctx.fillStyle = '#ff7a00';
  ctx.beginPath(); ctx.moveTo(-4, -9); ctx.quadraticCurveTo(-5, -15 * f, 0, -19 * f);
  ctx.quadraticCurveTo(5, -15 * f, 4, -9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe14d';
  ctx.beginPath(); ctx.moveTo(-2, -9); ctx.quadraticCurveTo(-2, -13 * f, 0, -15 * f);
  ctx.quadraticCurveTo(2, -13 * f, 2, -9); ctx.closePath(); ctx.fill();
}

function desenharGarrafas() {
  for (const g of garrafas) {
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.globalAlpha = 0.35;                                         // brilho de fogo em volta
    ctx.fillStyle = '#ff7a00';
    ctx.beginPath(); ctx.arc(0, 0, 13 + Math.sin(relogio * 30 + g.x) * 2, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.rotate(g.rot);
    garrafaForma();
    ctx.restore();
  }
}

// Pedacinhos voando quando algo é quebrado
function desenharParticulas() {
  for (const p of particulas) { ctx.fillStyle = p.cor || '#b5651d'; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
}

// Braço do macaco: do ombro até a mão (uma bolinha clara na ponta)
function bracoMacaco(xo, yo, xm, ym, corPelo, corMao) {
  ctx.strokeStyle = corPelo; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(xo, yo); ctx.lineTo(xm, ym); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = corMao;
  ctx.beginPath(); ctx.arc(xm, ym, 5.5, 0, Math.PI * 2); ctx.fill();
}

function desenharVilao() {
  const v = vilao, t = v.t;
  const furia = v.modo === 'furia';
  // cores normais, ou tudo vermelho na fúria
  const pelo = furia ? '#b3121a' : '#8b5a2b';
  const peloEsc = furia ? '#8c0c12' : '#7a4a1e';
  const claro = furia ? '#ff5547' : '#d9a76a';
  const narizC = furia ? '#5a0508' : '#5a3210';
  const bocaC = furia ? '#2a0003' : '#3a1500';

  // pose: posição das mãos, itens segurados e tipo de boca
  let mE = [-27, -8], mD = [27, -8];         // braços caídos
  let boca = 'fechada';
  const itens = [];
  const levantado = estado === 'jogo' && tempoFerido <= 0 && v.modo === 'normal' && tempoSpawn < 0.5;
  if (levantado) {                           // segura o barril antes de jogar
    mE = [-26, -64]; mD = [26, -64];
    itens.push({ tipo: 'barril', x: 0, y: -78 });
  } else if (v.modo === 'banana') {
    if (t < 0.65) {                          // levanta a banana para arremessar
      mD = [28, -70];
      itens.push({ tipo: 'banana', x: 28, y: -80, rot: 0.5, esc: 1 });
    } else if (t < 0.95) {                   // arremessa
      const u = (t - 0.65) / 0.3;
      mD = [28 + 8 * u, -70 + 42 * u];
    } else if (t < 2.0) {                    // bate no próprio peito
      const k = Math.floor((t - 0.95) / 0.25) % 2;
      mE = k === 0 ? [-8, -26] : [-30, -44];
      mD = k === 0 ? [30, -44] : [8, -26];
    } else if (t < 2.6) {                    // leva uma banana à boca
      const u = (t - 2.0) / 0.6;
      mD = [27 - 20 * u, -8 - 33 * u];
      itens.push({ tipo: 'banana', x: mD[0] + 2, y: mD[1] - 4, rot: -0.5 - u, esc: 1 });
    } else {                                 // come a banana
      const u = Math.min(1, (t - 2.6) / 0.9);
      mD = [7, -41];
      boca = Math.floor((t - 2.6) / 0.15) % 2 === 0 ? 'aberta' : 'fechada';
      if (u < 1) itens.push({ tipo: 'banana', x: 9, y: -45, rot: -1.5, esc: 1 - 0.75 * u });
    }
  } else if (furia) {
    boca = 'grito';
    const b = Math.sin(relogio * 16);        // bate os punhos
    mE = [-28, -30 + 14 * b]; mD = [28, -30 - 14 * b];
    if ((t >= 0.6 && t < 1.0) || (t >= 2.1 && t < 2.5)) {   // levanta a garrafa antes de arremessar
      mD = [26, -66];
      itens.push({ tipo: 'garrafa', x: 26, y: -78 });
    }
  }

  ctx.save();
  let tx = 36, ty = andares[TOPO].y;
  if (furia) { tx += Math.sin(relogio * 60) * 1.8; ty += Math.cos(relogio * 47) * 1.2; }   // treme de raiva
  ctx.translate(tx, ty);
  if (furia) {
    const s = 1 + 0.06 * Math.sin(relogio * 18);                                           // incha e desincha
    ctx.scale(s, s);
    ctx.globalAlpha = 0.2 + 0.1 * Math.sin(relogio * 14);                                  // brilho vermelho
    ctx.fillStyle = '#ff2a2a';
    ctx.beginPath(); ctx.arc(0, -34, 56, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // rabo enrolado
  ctx.strokeStyle = peloEsc; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-18, -12); ctx.bezierCurveTo(-40, -14, -42, -36, -28, -38); ctx.stroke();
  // pernas e pés
  ctx.fillStyle = peloEsc;
  ctx.fillRect(-16, -10, 12, 10); ctx.fillRect(4, -10, 12, 10);
  ctx.fillStyle = claro;
  ctx.fillRect(-18, -4, 14, 4); ctx.fillRect(4, -4, 14, 4);
  // corpo e barriga
  ctx.fillStyle = pelo; ctx.fillRect(-20, -38, 40, 30);
  ctx.fillStyle = claro; ctx.fillRect(-12, -32, 24, 20);
  // braços longos de macaco
  bracoMacaco(-20, -32, mE[0], mE[1], pelo, claro);
  bracoMacaco(20, -32, mD[0], mD[1], pelo, claro);
  // cabeça e orelhas
  ctx.fillStyle = pelo; ctx.fillRect(-14, -60, 28, 24);
  ctx.beginPath(); ctx.arc(-16, -48, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(16, -48, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = claro;
  ctx.beginPath(); ctx.arc(-16, -48, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(16, -48, 3.5, 0, Math.PI * 2); ctx.fill();
  // rosto
  ctx.fillRect(-10, -54, 20, 16);
  ctx.fillStyle = '#fff'; ctx.fillRect(-8, -52, 6, 6); ctx.fillRect(2, -52, 6, 6);
  ctx.fillStyle = furia ? '#ff0000' : '#000';
  if (furia) { ctx.fillRect(-7, -51, 4, 5); ctx.fillRect(3, -51, 4, 5); }
  else { ctx.fillRect(-6, -50, 3, 4); ctx.fillRect(3, -50, 3, 4); }
  ctx.strokeStyle = '#000'; ctx.lineWidth = furia ? 3 : 2;      // sobrancelhas bravas
  ctx.beginPath();
  if (furia) { ctx.moveTo(-11, -58); ctx.lineTo(-2, -50); ctx.moveTo(11, -58); ctx.lineTo(2, -50); }
  else { ctx.moveTo(-9, -55); ctx.lineTo(-2, -51); ctx.moveTo(9, -55); ctx.lineTo(2, -51); }
  ctx.stroke();
  ctx.fillStyle = narizC; ctx.fillRect(-3, -46, 2, 2); ctx.fillRect(1, -46, 2, 2);   // nariz
  if (boca === 'grito') {                                      // boca aberta gritando
    ctx.fillStyle = bocaC; ctx.fillRect(-7, -45, 14, 9);
    ctx.fillStyle = '#ff9aa0'; ctx.fillRect(-4, -39, 8, 3);
    ctx.fillStyle = '#fff'; ctx.fillRect(-6, -45, 3, 3); ctx.fillRect(3, -45, 3, 3);
  } else if (boca === 'aberta') {                              // mastigando (aberta)
    ctx.fillStyle = bocaC; ctx.fillRect(-6, -43, 12, 7);
    ctx.fillStyle = '#fff'; ctx.fillRect(-5, -43, 3, 2); ctx.fillRect(2, -43, 3, 2);
  } else {                                                     // boca fechada
    ctx.fillStyle = bocaC; ctx.fillRect(-6, -42, 12, 4);
    ctx.fillStyle = '#fff'; ctx.fillRect(-5, -42, 3, 2); ctx.fillRect(2, -42, 3, 2);
  }
  // itens nas mãos (barril, banana ou garrafa)
  for (const it of itens) {
    if (it.tipo === 'barril') desenharBarrilNo(it.x, it.y, 0);
    else {
      ctx.save();
      ctx.translate(it.x, it.y);
      if (it.tipo === 'banana') { ctx.rotate(it.rot); ctx.scale(1.2 * it.esc, 1.2); bananaForma(); }
      else { ctx.scale(1.2, 1.2); garrafaForma(); }
      ctx.restore();
    }
  }
  // fumaça saindo das orelhas na fúria
  if (furia) {
    ctx.fillStyle = '#ffd5cc';
    for (let k = 0; k < 3; k++) {
      const p = (relogio * 1.6 + k / 3) % 1;
      ctx.globalAlpha = 1 - p;
      ctx.beginPath();
      ctx.arc(-22 + (k % 2) * 44 + Math.sin(p * 6 + k) * 3, -56 - p * 26, 3 + p * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// Cores do macaquinho herói (dourado, para não se confundir com o macaco vilão)
const PELO = '#d99a3d', PELO_ESC = '#b9772f', PELO_CLARO = '#f6dcae';

function desenharHeroi() {
  const j = jogador;
  if (invulneravel > 0 && Math.floor(relogio * 12) % 2 === 0) return; // pisca depois de se machucar
  const f = Math.floor(j.anim) % 2;
  ctx.save();
  ctx.translate(j.x, j.y);
  if (j.estado === 'escorrega') {                  // casca de banana escorregando sob os pés
    ctx.save();
    ctx.translate(-j.face * 5, -3);
    ctx.scale(1.1, 1.1);
    bananaForma();
    ctx.restore();
  }
  if (j.estado === 'queda') {                      // estrelinhas de tontura
    for (let k = 0; k < 3; k++) {
      const ang = relogio * 10 + k * 2.1;
      estrela(Math.cos(ang) * 10, -38 + Math.sin(ang) * 3, 2.5, '#ffe14d');
    }
  }
  if (j.estado === 'ferido') {                     // cai de lado quando é atingido
    const prog = Math.min(1, (1.1 - tempoFerido) * 4);
    ctx.translate(0, -6);
    ctx.rotate(-Math.PI / 2 * prog);
    ctx.translate(0, 6);
  }
  if (j.estado === 'escorrega' || j.estado === 'queda') {   // gira para trás ao escorregar e cair
    const giro = j.estado === 'escorrega' ? Math.min(1, j.tEsc / 0.3) * 1.5 : 1.5 + j.vy * 0.004;
    ctx.translate(0, -14);
    ctx.rotate(-j.face * giro);
    ctx.translate(0, 14);
  }
  if (j.estado === 'escada') {
    // macaquinho de frente subindo a escada, braços alternando
    ctx.strokeStyle = PELO_ESC; ctx.lineWidth = 2; ctx.lineCap = 'round';       // rabinho
    ctx.beginPath(); ctx.moveTo(4, -8); ctx.quadraticCurveTo(13, -8, 10, -17); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = PELO_ESC;                                                    // pernas
    ctx.fillRect(-5, -9, 4, f ? 6 : 9); ctx.fillRect(1, -9, 4, f ? 9 : 6);
    ctx.fillStyle = '#2b4c9b'; ctx.fillRect(-6, -12, 12, 4);                     // shorts azul
    ctx.fillStyle = PELO; ctx.fillRect(-6, -20, 12, 9);                          // corpo
    ctx.fillStyle = PELO_CLARO; ctx.fillRect(-3, -18, 6, 6);                     // barriga
    ctx.fillStyle = PELO;
    ctx.fillRect(-10, f ? -28 : -22, 3, 8); ctx.fillRect(7, f ? -22 : -28, 3, 8);   // braços
    ctx.fillRect(-5, -29, 10, 9);                                                // cabeça
    ctx.beginPath(); ctx.arc(-6, -25, 3.2, 0, Math.PI * 2); ctx.arc(6, -25, 3.2, 0, Math.PI * 2); ctx.fill();   // orelhas
    ctx.fillStyle = PELO_CLARO;
    ctx.beginPath(); ctx.arc(-6, -25, 1.6, 0, Math.PI * 2); ctx.arc(6, -25, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-3, -27, 6, 6);                                                 // rosto
    ctx.fillStyle = '#000'; ctx.fillRect(-2, -26, 1.5, 2); ctx.fillRect(1, -26, 1.5, 2); ctx.fillRect(-1, -22, 2, 1);
    if (martelo > 0) {                               // marreta ao lado do corpo na escada
      ctx.save();
      ctx.translate(9, -18);
      ctx.rotate(0.5 + Math.sin(relogio * 14) * 0.5);
      formaMarreta();
      ctx.restore();
    }
  } else {
    ctx.scale(j.face, 1);
    const ar = j.estado === 'ar' || j.estado === 'escorrega' || j.estado === 'queda';
    // macaquinho de lado (bem menor que o macaco vilão)
    ctx.strokeStyle = PELO_ESC; ctx.lineWidth = 2; ctx.lineCap = 'round';       // rabinho enrolado
    ctx.beginPath(); ctx.moveTo(-5, -10); ctx.quadraticCurveTo(-14, -9, -11, -19); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = PELO_ESC;                                                    // pernas
    if (ar) { ctx.fillRect(-6, -9, 5, 7); ctx.fillRect(2, -9, 6, 5); }
    else { ctx.fillRect(-5 + (f ? -1 : 1), -9, 4, 9); ctx.fillRect(1 + (f ? 1 : -1), -9, 4, 9); }
    ctx.fillStyle = '#2b4c9b'; ctx.fillRect(-6, -12, 12, 4);                     // shorts azul
    ctx.fillStyle = PELO; ctx.fillRect(-6, -20, 12, 9);                          // corpo
    ctx.fillStyle = PELO_CLARO; ctx.fillRect(-1, -18, 6, 6);                     // barriga
    ctx.fillStyle = PELO;                                                        // braço
    if (ar) ctx.fillRect(3, -28, 3, 9); else ctx.fillRect(-1, -19, 3, 8);
    ctx.fillRect(-5, -29, 10, 9);                                                // cabeça
    ctx.beginPath(); ctx.arc(-4, -25, 3.2, 0, Math.PI * 2); ctx.fill();          // orelha
    ctx.fillStyle = PELO_CLARO;
    ctx.beginPath(); ctx.arc(-4, -25, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(0, -27, 6, 6);                                                  // focinho
    ctx.fillStyle = '#000'; ctx.fillRect(1.5, -27, 2, 2);                        // olho
    ctx.fillStyle = '#5a3210'; ctx.fillRect(4.5, -24, 1.5, 1.5);                 // nariz
    if (martelo > 0) {                               // marreta balançando para frente
      ctx.save();
      ctx.translate(5, -16);
      ctx.rotate(0.6 + Math.sin(relogio * 14) * 0.7);
      formaMarreta();
      ctx.restore();
    }
  }
  ctx.restore();
}

function coracao(x, y, s, cor) {
  ctx.fillStyle = cor;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.35);
  ctx.fill();
}

function desenharHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(vx0 - 10, 0, vx1 - vx0 + 20, 46);
  ctx.save();
  ctx.translate(DX, 0);                              // os itens do topo ficam centralizados
  texto('PONTOS', 12, 17, 12, '#9fb3d9', 'left');
  texto(String(pontos), 12, 38, 20, '#ffffff', 'left');
  texto('RECORDE', 150, 17, 12, '#9fb3d9');
  texto(String(Math.max(recorde, pontos)), 150, 38, 20, '#ffd400');
  // vidas: 3 corações, ou 4 se pegou o coração extra
  const nCor = Math.max(dif.vidas, vidas);          // um coração para cada vida (cabem até 5 no topo)
  const espaco = nCor <= 4 ? 24 : 20;
  for (let i = 0; i < nCor; i++) coracao(360 - 22 - i * espaco, 12, 20, i < vidas ? '#ff3b4e' : '#3a3f55');
  if (estado === 'jogo') {                           // botão de pausa
    const b = botaoPausa;
    ctx.fillStyle = '#2b2158'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#ffd400';
    ctx.fillRect(b.x + 8, b.y + 8, 4, 12); ctx.fillRect(b.x + 15, b.y + 8, 4, 12);
    texto('PAUSE', b.x + 24, b.y + 19, 11, '#ffffff', 'left');
  }
  if (martelo > 0) {                                 // barrinha do tempo da marreta
    texto('MARRETA', 12, 62, 11, '#ffb300', 'left');
    ctx.fillStyle = '#3a3f55'; ctx.fillRect(72, 54, 100, 8);
    ctx.fillStyle = '#ffb300'; ctx.fillRect(72, 54, 100 * martelo / TEMPO_MARRETA, 8);
  }
  ctx.restore();
}

function painel(y, h) {
  ctx.fillStyle = 'rgba(5,8,20,0.82)';
  ctx.fillRect(20, y, 320, h);
  ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 2;
  ctx.strokeRect(20, y, 320, h);
}

function desenharTelas() {
  const piscar = Math.floor(relogio * 2) % 2 === 0;
  ctx.save();
  ctx.translate(DX, DY);                             // menus sempre no centro da torre
  if (estado === 'menu') {
    painel(100, 490);
    texto('DONKEY SEST', 180, 158, 38, '#ffd400');
    texto('Chegue ao baú de bananas no topo!', 180, 192, 15, '#ffffff');
    texto('Fuja dos barris e das garrafas de fogo.', 180, 214, 13, '#9fb3d9');
    texto('A / D ou ← →: andar', 180, 254, 14, '#ffffff');
    texto('W / S ou ↑ ↓: subir e descer escadas', 180, 276, 14, '#ffffff');
    texto('Espaço ou W: pular', 180, 298, 14, '#ffffff');
    texto(controlesToque ? 'Celular: use os botões ◀ ▶ ▼ ▲ e PULAR' : 'Celular: arraste para andar e subir,', 180, 324, 13, '#9fb3d9');
    texto(controlesToque ? '(ou arraste o dedo / toque rápido)' : 'toque rápido para pular', 180, 342, 13, '#9fb3d9');
    texto('Pule por cima do barril: +100 pontos', 180, 374, 14, '#5de0ff');
    texto('Marreta: quebra barris e garrafas (+300)', 180, 396, 13, '#ffb300');
    texto('Cuidado: banana faz escorregar e cair!', 180, 418, 13, '#ffe14d');
    texto('A cada 15 s o macaco enfurece!', 180, 440, 13, '#ff8a5c');
    texto('Pegue o coração: +1 vida', 180, 462, 13, '#ff6b7a');
    texto('Pause: botão ou tecla P', 180, 484, 13, '#9fb3d9');
    if (piscar) texto('TOQUE OU ESPAÇO PARA ESCOLHER', 180, 545, 16, '#ffd400');
  } else if (estado === 'dificuldade') {
    painel(150, 400);
    texto('ESCOLHA A DIFICULDADE', 180, 196, 22, '#ffd400');
    texto('Toque num nível para começar', 180, 218, 13, '#9fb3d9');
    for (const b of botoesNivel) {
      const sel = b.i === opcaoNivel;
      ctx.fillStyle = sel ? b.cor : '#2b2158';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = b.cor; ctx.lineWidth = sel ? 4 : 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
      texto(NIVEIS[ORDEM_NIVEIS[b.i]].nome, b.x + b.w / 2, b.y + 32, 24, sel ? '#1a1033' : b.cor);
      texto(b.desc, b.x + b.w / 2, b.y + 56, 11, sel ? '#1a1033' : '#ffffff');
    }
    texto('↑ ↓ escolhem · Enter ou toque começa', 180, 520, 12, '#9fb3d9');
  } else if (estado === 'perdeu') {
    painel(240, 250);
    texto('FIM DE JOGO', 180, 295, 34, '#ff3b4e');
    texto('Pontos: ' + pontos, 180, 345, 22, '#ffffff');
    texto('Recorde: ' + recorde, 180, 378, 20, '#ffd400');
    texto('Dificuldade: ' + dif.nome, 180, 415, 14, '#9fb3d9');
    if (piscar) texto('TOQUE PARA JOGAR DE NOVO', 180, 465, 17, '#ffd400');
  } else if (estado === 'ganhou') {
    painel(240, 250);
    texto('VOCÊ CHEGOU AO TOPO!', 180, 295, 26, '#5de0ff');
    texto('Pontos: ' + pontos, 180, 345, 22, '#ffffff');
    texto('Recorde: ' + recorde, 180, 378, 20, '#ffd400');
    texto('Parabéns, campeão! (' + dif.nome + ')', 180, 415, 14, '#9fb3d9');
    if (piscar) texto('TOQUE PARA JOGAR DE NOVO', 180, 465, 17, '#ffd400');
  }
  ctx.restore();
}

// Retângulo com cantos arredondados
function retArredondado(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Botões na tela para celular: ◀ ▶ ▼ ▲ e PULAR (desenhados em pixels da tela, por cima do jogo)
function desenharBotoesToque() {
  if (!controlesToque || estado !== 'jogo') return;
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pulando = Object.keys(dedosBotao).some(function (id) { return dedosBotao[id] === 'pulo'; });
  for (const b of botoesTela.lista) {
    const ativo = b.id === 'pulo' ? pulando : botoes[b.id];
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2, k = b.w * 0.26;
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = ativo ? '#ffd400' : '#1a1033';
    retArredondado(b.x, b.y, b.w, b.h, 14);
    ctx.fill();
    ctx.globalAlpha = 0.95;
    ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = ativo ? '#1a1033' : '#ffd400';
    if (b.id === 'pulo') {
      ctx.font = 'bold ' + Math.round(b.w * 0.2) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('PULAR', cx, cy);
    } else {
      ctx.beginPath();                                   // seta (triângulo)
      if (b.id === 'esq') { ctx.moveTo(cx + k, cy - k); ctx.lineTo(cx - k, cy); ctx.lineTo(cx + k, cy + k); }
      else if (b.id === 'dir') { ctx.moveTo(cx - k, cy - k); ctx.lineTo(cx + k, cy); ctx.lineTo(cx - k, cy + k); }
      else if (b.id === 'cima') { ctx.moveTo(cx - k, cy + k * 0.7); ctx.lineTo(cx, cy - k); ctx.lineTo(cx + k, cy + k * 0.7); }
      else { ctx.moveTo(cx - k, cy - k * 0.7); ctx.lineTo(cx, cy + k); ctx.lineTo(cx + k, cy - k * 0.7); }
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.restore();
}

// Menu de pausa (escurece a tela e mostra os dois botões)
function desenharPausa() {
  ctx.fillStyle = 'rgba(5,3,20,0.6)';
  ctx.fillRect(vx0 - 10, vy0 - 10, vx1 - vx0 + 20, vy1 - vy0 + 20);
  ctx.save();
  ctx.translate(DX, DY);
  painel(290, 200);
  texto('PAUSADO', 180, 338, 32, '#ffd400');
  for (let i = 0; i < botoesPausa.length; i++) {
    const b = botoesPausa[i];
    const sel = i === opcaoPausa;
    ctx.fillStyle = sel ? '#ffd400' : '#2b2158';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
    texto(b.txt, b.x + b.w / 2, b.y + 29, 18, sel ? '#1a1033' : '#ffffff');
  }
  ctx.restore();
}

function desenhar() {
  ctx.setTransform(dpr * esc, 0, 0, dpr * esc, dpr * ox, dpr * oy);
  ctx.save();
  if (tremor > 0 && !pausado) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);

  desenharFundo();
  desenharAndares();
  desenharEscadas();
  desenharMeta();
  desenharMartelos();
  desenharCoracaoVida();
  desenharBananas();
  desenharVilao();
  for (const b of barris) desenharBarrilNo(b.x, b.y, b.rot);
  desenharGarrafas();
  desenharParticulas();
  if (estado !== 'menu' && estado !== 'dificuldade') desenharHeroi();
  else { jogador.face = 1; desenharHeroi(); }

  for (const p of popups) {                         // textos que sobem e somem
    ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
    texto(p.txt, p.x, p.y - p.t * 30, 16, '#ffd400');
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  desenharHUD();
  desenharTelas();
  desenharBotoesToque();
  if (pausado) desenharPausa();
}

// ---------- Laço principal: roda uns 60 vezes por segundo ----------
let ultimo = performance.now();
function quadro(agora) {
  const dt = Math.min(0.05, (agora - ultimo) / 1000);
  ultimo = agora;
  if (!pausado) relogio += dt;       // pausado: as animações também param
  atualizar(dt);
  desenhar();
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
</script>
